version: '3.8'

services:
  images-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8084:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - mongodb
      - keycloak
      - imgproxy

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    ports:
      - "8081:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    command: start-dev

  imgproxy:
    image: darthsim/imgproxy:latest
    ports:
      - "8888:8080"
    environment:
      IMGPROXY_KEY: test-key
      IMGPROXY_SALT: test-salt
      IMGPROXY_ALLOW_INSECURE_URLS: "true"

volumes:
  mongodb_data:
